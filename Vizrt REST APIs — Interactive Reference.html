<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viz Graphic Hub REST API — Interactive Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfa;--panel:#ffffff;--side:#f4f4f2;--ink:#1d1d1f;--mute:#6b6b70;--line:#e6e5e1;--soft:#f0efec;
  --accent:#3a5bd9;--accent-soft:#eaeefc;--code-bg:#16181d;--code-ink:#e6e6e6;--code-mute:#8b93a3;
  --get:#1f8a5b;--post:#2f63d6;--put:#b7791f;--delete:#c53b3b;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121315;--panel:#17181b;--side:#141517;--ink:#ececee;--mute:#9a9aa2;--line:#2a2b30;--soft:#1e1f23;
  --accent:#7d97ff;--accent-soft:#1f2640;--code-bg:#0d0e10;
  --get:#3fbf86;--post:#6e95ff;--put:#e0a94a;--delete:#f07272;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
code,.mono{font-family:var(--mono);font-size:.88em}
:not(pre)>code{background:var(--soft);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
/* sidebar */
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:18px 14px 40px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin:2px 6px 2px}
.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.search{margin:14px 0 10px;position:relative}
.search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:9px;top:9px;color:var(--mute)}
.nav-group{margin-top:14px}
.nav-group h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 6px 4px;font-weight:600}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;border-radius:6px;color:var(--ink);font-size:13.5px}
.nav a:hover{background:var(--soft)}
.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav a .dots{display:flex;gap:3px}
.nav a .dots i{width:6px;height:6px;border-radius:50%;display:block}
.nav .hit{display:block;padding:3px 8px 3px 18px;font-size:12.5px;color:var(--mute);font-family:var(--mono)}
.nav .hit:hover{color:var(--ink)}
/* main */
main{min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 32px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.topbar label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:flex;flex-direction:column;gap:3px}
.topbar input{font:13px var(--mono);padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);outline:none;min-width:0}
.topbar input:focus{border-color:var(--accent)}
#baseUrl{width:240px}#user{width:110px}#pass{width:110px}
.authpreview{font:12px var(--mono);color:var(--mute);align-self:flex-end;padding-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}
.langs{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:flex-end}
.langs button{border:0;background:var(--panel);color:var(--mute);font:500 12.5px var(--sans);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line)}
.langs button:last-child{border-right:0}
.langs button.on{background:var(--accent);color:#fff}
.content{max-width:1040px;padding:28px 32px 120px}
h1{font-size:30px;letter-spacing:-.02em;margin:8px 0 6px}
h2{font-size:22px;letter-spacing:-.015em;margin:0 0 4px}
h3{font-size:15px;margin:22px 0 8px}
.lead{color:var(--mute);font-size:15.5px;max-width:760px}
section.res{padding-top:36px;margin-top:36px;border-top:1px solid var(--line);scroll-margin-top:70px}
.res-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.full{color:var(--get);border-color:color-mix(in srgb,var(--get) 40%,transparent)}
.pill.limited{color:var(--put);border-color:color-mix(in srgb,var(--put) 40%,transparent)}
.pill.none{color:var(--delete);border-color:color-mix(in srgb,var(--delete) 40%,transparent)}
.pill.noauth{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.intro p{margin:6px 0;max-width:780px;color:var(--ink)}
.intro ul{margin:4px 0;padding-left:20px}
/* endpoint */
.ep{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-top:14px;overflow:hidden;scroll-margin-top:70px}
.ep-h{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;user-select:none}
.ep-h:hover{background:var(--soft)}
.m{font:600 11.5px var(--mono);padding:3px 0;border-radius:5px;color:#fff;width:62px;text-align:center;flex:none}
.m.GET{background:var(--get)}.m.POST{background:var(--post)}.m.PUT{background:var(--put)}.m.DELETE{background:var(--delete)}
.path{font:500 13.5px var(--mono);word-break:break-all}
.path .p{color:var(--accent)}
.ep-sum{color:var(--mute);font-size:13px;margin-left:auto;text-align:right;flex:0 1 38%}
.chev{flex:none;color:var(--mute);transition:transform .15s}
.ep.open .chev{transform:rotate(90deg)}
.ep-b{display:none;border-top:1px solid var(--line);grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.ep.open .ep-b{display:grid}
.ep-l{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.ep-r{padding:14px;background:var(--soft);min-width:0}
.ep-l p{margin:0 0 10px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600;margin:14px 0 6px}
.k:first-child{margin-top:0}
.codes{display:flex;flex-direction:column;gap:4px}
.code-row{display:flex;gap:8px;font-size:13px;align-items:baseline}
.code-row b{font:600 12px var(--mono);padding:1px 6px;border-radius:4px;flex:none}
.c2{background:color-mix(in srgb,var(--get) 15%,transparent);color:var(--get)}
.c4{background:color-mix(in srgb,var(--put) 16%,transparent);color:var(--put)}
.c5{background:color-mix(in srgb,var(--delete) 14%,transparent);color:var(--delete)}
.code-row span{color:var(--mute)}
ul.tips{margin:0;padding-left:18px;font-size:13.5px}
ul.tips li{margin:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:12px var(--mono);background:var(--soft);border:1px solid var(--line);padding:1px 7px;border-radius:5px}
.req .chip{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.params{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.params label{font:12.5px var(--mono);color:var(--mute)}
.params input{font:12.5px var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:100%;outline:none}
.params input:focus{border-color:var(--accent)}
/* code block */
.cb{background:var(--code-bg);border-radius:9px;overflow:hidden;margin-bottom:10px}
.cb-h{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 6px 12px;border-bottom:1px solid #2a2d35;font:12px var(--sans);color:var(--code-mute)}
.cb pre{margin:0;padding:12px 14px;overflow:auto;color:var(--code-ink);font:12.5px/1.6 var(--mono);max-height:420px;white-space:pre}
.copy{background:transparent;border:1px solid #3a3e48;color:#cfd3dc;font:500 11.5px var(--sans);padding:3px 9px;border-radius:5px;cursor:pointer}
.copy:hover{border-color:#6b7280}
.copy.ok{color:#5fd39a;border-color:#2f6b4f}
.tk-s{color:#a5d6a7}.tk-k{color:#c792ea}.tk-f{color:#82aaff}.tk-c{color:#6b7280}.tk-t{color:#f78c6c}.tk-a{color:#ffcb6b}
/* try it */
.try{border:1px dashed var(--line);border-radius:9px;padding:10px 12px;background:var(--panel)}
.try textarea{width:100%;min-height:150px;font:12px/1.5 var(--mono);border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--bg);color:var(--ink);resize:vertical}
.btn{font:600 12.5px var(--sans);padding:6px 13px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.warn{background:var(--delete);border-color:var(--delete)}
.try-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font:12px var(--mono);color:var(--mute)}
.resp{margin-top:10px;display:none}
/* field table */
details.fields{margin-top:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.fields summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13.5px;list-style:none;display:flex;justify-content:space-between}
details.fields summary::-webkit-details-marker{display:none}
details.fields summary::after{content:"Show";font-weight:500;color:var(--accent);font-size:12.5px}
details.fields[open] summary::after{content:"Hide"}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 12px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;background:var(--soft)}
td.fn{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
td.fn.sub{padding-left:28px;color:var(--mute)}
.ty{font:11.5px var(--mono);color:var(--mute)}
.ed{font-size:11px;font-weight:600;color:var(--get)}
.ro{font-size:11px;color:var(--mute)}
/* overview cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}
.card{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:14px 16px}
.card h4{margin:0 0 6px;font-size:14px}
.card p{margin:0;color:var(--mute);font-size:13.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{font-family:var(--mono);color:var(--accent)}.kv dd{margin:0;font-family:var(--mono);color:var(--mute);word-break:break-all}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 13px;border-radius:0 8px 8px 0;font-size:13.5px;margin:12px 0}
.warn-note{border-left-color:var(--delete);background:color-mix(in srgb,var(--delete) 9%,transparent)}
.changelog details{border-top:1px solid var(--line);padding:8px 0}
.changelog summary{cursor:pointer;font:600 13px var(--mono)}
.changelog ul{margin:6px 0 0;padding-left:20px;font-size:13.5px;color:var(--mute)}
.empty{color:var(--mute);padding:40px 0;text-align:center;display:none}
.apis{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;align-self:flex-end}
.apis button{border:0;background:transparent;color:var(--mute);font:600 13px var(--sans);padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.apis button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.authfield.hide{display:none}
.menu-btn{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:280px;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  aside.show{transform:none}
  .menu-btn{display:inline-flex;align-self:flex-end;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer}
  .ep-b{grid-template-columns:1fr}.ep-l{border-right:0;border-bottom:1px solid var(--line)}
  .ep-sum{display:none}.content,.topbar{padding-left:16px;padding-right:16px}.langs{margin-left:0}
}
</style>
</head>
<body>
<div class="layout">
<aside id="side">
  <div class="brand" id="brand"></div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search endpoints, fields…  ( / )" autocomplete="off">
  </div>
  <nav class="nav" id="nav"></nav>
</aside>
<main>
  <div class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="apis" id="apis"><button data-api="gh">Graphic Hub</button><button data-api="pds">Pilot Data Server</button></div>
    <label>Base URL<input id="baseUrl" value="http://127.0.0.1:19398"></label>
    <label class="authfield">User<input id="user" value="Admin"></label>
    <label class="authfield">Password<input id="pass" value="VizDb" type="password"></label>
    <div class="authpreview authfield" id="authPrev"></div>
    <div class="langs" id="langs"></div>
  </div>
  <div class="content" id="content"></div>
</main>
</div>

<script>
/* ============================== DATA ============================== */
const GH_GROUPS=["Basic resources","Advanced resources","REST agent resources","REST configuration","Deploy Agent"];
const VDF="application/vnd.vizrt.payload+xml";
const NS='xmlns="http://www.vizrt.com/types"';
const L=(e)=>["self: The current atom:entry "+e+".","describedby: The properties of the current atom:entry "+e+"."];
const FILE_LINKS=["up: The parent folder of the file.","self: The current atom:entry file.","describedby: The properties (VDF) of the file.","controlmodel: Control model of the file (only included if one is available).","history: Atom feed of all history entries of the file.","addon: Atom feed of all addons of the file.","media:content type=\"image\": Image download for files of type IMAGE.","media:thumbnail: Thumbnail of the file."];
const RIGHTS=["access-rights||0|The list of access rights|user-rights,group-rights,world-rights","user-rights|boolean|1|User rights set to write (else read-only)","group-rights|boolean|1|Group rights set to write (else read-only)","world-rights|boolean|1|World rights set to write (else read-only)"];
const rightsXml=(u,g,w)=>`  <field name="access-rights">\n    <field name="user-rights"><value>${u}</value></field>\n    <field name="group-rights"><value>${g}</value></field>\n    <field name="world-rights"><value>${w}</value></field>\n  </field>`;
const pl=(model,body)=>`<payload ${NS}${model?`\n  model="HOST/model/${model}"`:''}>\n${body}\n</payload>`;
const fld=(n,v)=>`  <field name="${n}"><value>${v}</value></field>`;

const GH_RES=[
/* ---------- BASIC ---------- */
{id:"service-document",t:"Service Document",g:0,c:"full",d:["The root resource of the API: an Atom Service Document (RFC 5023) listing every collection the server exposes. Clients should start here to discover resource locations instead of hard-coding them.","It's always published at the root of the GH REST service port (default <code>19398</code>), e.g. <code>http://vizgh.example.com:19398/</code>."],
 ep:[["GET","/","Discover all collections (application/atomsvc+xml)","200,404,500",{}]]},

{id:"folders",t:"Folders",g:0,c:"full",d:["The folder tree of the Graphic Hub, exposed as an Atom feed you navigate via each entry's <code>rel=\"down\"</code> link. Folder properties are VDF documents reachable from the feed."],
 ep:[["GET","/folders","Root folder structure (Atom feed)","200,404:Invalid parent folder uuid.,403,500,502",{ln:["up: Parent folder, or the /data root folder if there is none.","self: The current folder entry.","down: Sub-folders (includes thr:count).","describedby: Folder properties (VDF).","addon: Atom feed of all addons on the folder.","related: Atom feed of all files in the folder."]}],
  ["GET","/metadata/folder/{folder-id:389fc145-284e-4664-ab4c-dc009951e2be}","Folder properties (VDF)","200,404:Invalid folder uuid.,403,500,502",{}],
  ["GET","/folders?target=default","Default folder location (created if missing)","200,404,403,500,502",{}],
  ["POST","/folder/{parent-id:49ad30fb-036a-47c7-b098-cf8472ad24eb}/","Create a folder under a parent","201:The response body is the new folder.,400:Invalid input — check the request headers.,403,404:Creation failed.,500",{ct:VDF,bf:"postfolder.xml",rq:["name"],
    b:pl("folder",[fld("name","new folder"),fld("type","1"),rightsXml(true,true,true),fld("owner-id","8614")].join("\n")),
    tp:["You can also POST an <code>application/atom+xml;type=feed</code> to create a folder.","The only required field is <code>//payload/field[@name=\"name\"]</code> or <code>atom:title</code>.","Setting <code>type</code> may fail: a project cannot be created under a folder.","Folders can't be created in batches."]}],
  ["PUT","/folder/{folder-id:49ad30fb-036a-47c7-b098-cf8472ad24eb}/","Modify (rename / move / re-own) a folder","200:The response body is the modified folder.,400:Invalid input — check headers and content type.,403,404:Modification failed.,500",{ct:VDF,bf:"putfolder.xml",rq:["name"],
    b:pl("folder",[fld("id","49ad30fb-036a-47c7-b098-cf8472ad24eb"),fld("parent-id","aaa87dfd-bbbb-46f5-ae6d-2bd377047deb"),fld("name","changed_folder"),rightsXml(true,false,true),fld("owner-id","999")].join("\n")),
    tp:["Only send changed fields to minimise bandwidth.","Move a folder by changing <code>parent-id</code>.","<code>owner-id</code> is a user id from Users."]}],
  ["DELETE","/folder/{folder-id:49ad30fb-036a-47c7-b098-cf8472ad24eb}/","Delete a folder and all sub-folders","200,204,403,404:Resource to delete not found.,400,500",{tp:["Folders containing files referenced from outside the folder cannot be deleted."]}]],
 f:["id|uuid|0|The folder identifier","parent-id|uuid|1|The parent folder identifier","name|string|1|The name","type|integer|0|1 = folder, 2 = project","date-created|datetime|0|Creation date and time","date-expired|datetime|0|Date when the folder expires and can be deleted (null = not set)","owner-id|integer|1|User id of the folder owner","is-system-folder|boolean|0|Folder is a system folder",...RIGHTS]},

{id:"files",t:"Files",g:0,c:"full",d:["Files stored on the Graphic Hub. A folder's files are listed as an Atom feed; each file's properties are a VDF document."],
 ep:[["GET","/files/{folder-id:150F0D08-7BF9-894A-B8FC50242D6B7032}/","List files in a folder (Atom feed)","200,403,404:Folder not found.,500,502",{ln:[...FILE_LINKS,"vosmt: Viz open search media type."],tp:["<code>category</code> holds the file type."]}],
  ["GET","/file/{file-id:97398e73-b305-de45-8eae-7a37bcc071ab}/{folder-id:150F0D08-7BF9-894A-B8FC50242D6B7032}/","Single file entry with its 'up' link set to a given folder","200,403,404:Folder not found.,500,502",{ln:FILE_LINKS}],
  ["GET","/files/{folder-id:150F0D08-7BF9-894A-B8FC50242D6B7032}/?term={type:IMAGE}","List files of one type in a folder","200,403,404:Folder not found.,500,502",{tp:["<code>term</code> is a type name from Types (IMAGE, AUDIO_CLIP, VIDEO_CLIP, …)."]}],
  ["GET","/metadata/file/{file-id:a743d4e6-bcb7-c545-9cde-41d881c133cd}/","File properties (VDF)","200,403,404:File not found.,500,502",{tp:["<code>type</code> → Types; <code>locked</code>, <code>checked-out</code>, <code>owner</code>, <code>modifier</code> → Users; <code>keywords</code> → Keywords; <code>folder-links</code> → Folders."]}],
  ["POST","/checksum/files","Check whether files still exist","200:File exists if the response contains id and original-checksum.,400:Wrong payload format.,403,404,500",{ct:VDF,bf:"postfile.xml",
    b:`<?xml version="1.0" encoding="UTF-8"?>\n<payload ${NS}>\n  <field name="check-ids">\n    <list>\n      <payload>\n        <field name="id"><value>66AF0CD5-457E-7E47-AD45-A1B8FABDA0E3</value></field>\n      </payload>\n    </list>\n  </field>\n</payload>`}],
  ["PUT","/metadata/file/{file-id:aa34d9c0-0553-4b1a-b376-188877d698bd}/","Modify file properties (rename, move, link, keywords, delete)","200:The response body is the modified file.,400:Invalid input — check headers and content type.,403,404:Modification failed.,500",{ct:VDF,bf:"putfile.xml",

/* path template helpers: {name:sample} */
const PRX=/\{([^}:]+):([^}]*)\}/g;
const pName=(r,i,n)=>r.id+"|"+i+"|"+n;
function fillPath(r,i,p){return p.replace(PRX,(_,n,v)=>{const k=pName(r,i,n);return S.params[k]!=null?S.params[k]:v})}
function showPath(p){return esc(p.replace(PRX,"\u0001$1\u0002")).replace(/\u0001([^\u0002]*)\u0002/g,'<span class="p">{$1}</span>')}
function encodeUrlPath(u){return u.replace(/;/g,"%3B")}

/* ============================== CODE GEN ============================== */
function gen(r,i,lang){
  const [m,p,,,o]=r.ep[i];const url=base()+encodeUrlPath(fillPath(r,i,p));
  const needAuth=API[S.api].auth&&(!r.noauth||m!=="GET");const a=auth();
  const hasBody=!!(o.b||o.bf);const bin=o.up;const ct=o.ct;
  const hd=Object.assign({},o.hd||{});
  if(lang==="curl"){
    const L=[`curl${m!=="GET"?" --request "+m:""} "${url}"`];
    if(needAuth)L.push(`  --header "Authorization: ${a}"`);
    if(ct)L.push(`  --header "Content-Type: ${ct}"`);
    for(const k in hd)L.push(`  --header "${k}: ${hd[k]}"`);
    if(hasBody)L.push(`  --data-binary @${o.bf}`);
    if(bin)L.push(`  --data-binary @${bin}`);
    if(o.bin)L.push(`  --output ${p.includes("thumbnail")?"thumb.jpg":p.includes("video")?"chunk.h264":p.includes("audio")?"clip.wav":"image.jpg"}`);
    let out=L.join(" \\\n");
    if(!o.bin)out+="\n# optional: pipe through  | tidy -xml -i -w 0  to pretty-print";
    return out;
  }
  if(lang==="js"){
    const h=[];if(needAuth)h.push(`    Authorization: "${a}"`);if(ct)h.push(`    "Content-Type": "${ct}"`);for(const k in hd)h.push(`    "${k}": "${hd[k]}"`);
    let pre="";if(hasBody)pre=`const body = \`${(o.b||"<!-- "+o.bf+" -->").replace(/HOST/g,base()).replace(/`/g,"\\`")}\`;\n\n`;
    if(bin)pre=`// e.g. from <input type="file">\nconst body = fileInput.files[0];\n\n`;
    const read=o.bin?`const blob = await res.blob();\nconst objectUrl = URL.createObjectURL(blob);`:`const xml = new DOMParser().parseFromString(await res.text(), "application/xml");\nconsole.log(xml);`;
    return `${pre}const res = await fetch("${url}", {\n  method: "${m}",\n  headers: {\n${h.join(",\n")}\n  }${hasBody||bin?",\n  body":""}\n});\nif (!res.ok) throw new Error(\`HTTP \${res.status}\`);\n${read}`;
  }
  if(lang==="py"){
    const h=[];if(ct)h.push(`"Content-Type": "${ct}"`);for(const k in hd)h.push(`"${k}": "${hd[k]}"`);
    let pre="import requests\n\n";
    if(hasBody)pre+=`body = """${(o.b||"<!-- "+o.bf+" -->").replace(/HOST/g,base())}"""\n\n`;
    const args=[`"${m}"`,`"${url}"`];
    if(needAuth)args.push(`auth=("${S.user}", "${S.pass.replace(/"/g,'\\"')}")`);
    if(h.length)args.push(`headers={${h.join(", ")}}`);
    if(hasBody)args.push(`data=body.encode("utf-8")`);
    if(bin)args.push(`data=open("${bin}", "rb")`);
    const tail=o.bin?`\nwith open("output.bin", "wb") as f:\n    f.write(res.content)`:`\nprint(res.text)`;
    return `${pre}res = requests.request(\n    ${args.join(",\n    ")}\n)\nres.raise_for_status()${tail}`;
  }
  if(lang==="ps"){
    const h=[];if(needAuth)h.push(`  Authorization = "${a}"`);for(const k in hd)h.push(`  "${k}" = "${hd[k]}"`);
    const L=[`$headers = @{\n${h.join("\n")}\n}`];
    let call=`Invoke-WebRequest -Uri "${url}" -Method ${m[0]+m.slice(1).toLowerCase()} -Headers $headers`;
    if(ct)call+=` \`\n  -ContentType "${ct}"`;
    if(hasBody)call+=` \`\n  -InFile ".\\${o.bf}"`;
    if(bin)call+=` \`\n  -InFile ".\\${bin}"`;
    if(o.bin)call+=` \`\n  -OutFile ".\\output.bin"`;
    L.push((o.bin?"":"$res = ")+call);
    if(!o.bin)L.push("[xml]$res.Content");
    return L.join("\n");
  }
}
function hl(code,lang){
  let s=esc(code);
  const toks=[];const keep=(re,cls)=>{s=s.replace(re,m=>{toks.push(`<span class="${cls}">${m}</span>`);return`\u0000${toks.length-1}\u0000`})};
  if(lang==="xml"){keep(/&lt;!--[\s\S]*?--&gt;/g,"tk-c");keep(/"[^"\n]*"/g,"tk-s");keep(/&lt;\/?[\w:-]+/g,"tk-k");keep(/\/?&gt;/g,"tk-k");keep(/\b[\w:-]+(?==)/g,"tk-a");}
  else{
    keep(/"""[\s\S]*?"""|`[\s\S]*?`|"(?:[^"\\\n]|\\.)*"/g,"tk-s");
    keep(/(^|[ \t])(#|\/\/)[^\n]*/gm,"tk-c");
    if(lang==="curl")keep(/(--[\w-]+)/g,"tk-k");
    if(lang==="js")keep(/\b(const|await|new|if|throw|return)\b/g,"tk-k");
    if(lang==="py")keep(/\b(import|with|as|open|print)\b/g,"tk-k");
    if(lang==="ps")keep(/\$\w+|-\w+(?=\s)/g,"tk-k");
    keep(/\b(curl|fetch|requests|Invoke-WebRequest|DOMParser|URL)\b/g,"tk-f");
  }
  while(/\u0000\d+\u0000/.test(s))s=s.replace(/\u0000(\d+)\u0000/g,(_,n)=>toks[n]);
  return s;
}
function codeBlock(title,code,lang,extraCls=""){
  return `<div class="cb ${extraCls}"><div class="cb-h"><span>${esc(title)}</span><button class="copy" data-copy>Copy</button></div><pre data-raw="${esc(code)}">${hl(code,lang)}</pre></div>`;
}

  <div class="chips" style="gap:8px">${Object.values(CLUSTER).map(c=>`<span class="pill ${c[1]}" title="${c[2]}">${c[0]}</span> <span style="font-size:13px;color:var(--mute);margin-right:12px">${c[2]}</span>`).join("<br>")}</div>

  <h3>Status codes</h3>
  <div class="codes">${Object.entries(CODE_TXT).map(([k,v])=>`<div class="code-row"><b class="c${k[0]}">${k}</b><span>${v}</span></div>`).join("")}</div>
  <p style="color:var(--mute);font-size:13px">Empty collections return an empty feed with <b>200</b> (not 404) since 1.0.1.</p>

  <h3>Changelog</h3>
  <div class="changelog">${CHANGELOG.map(([v,l],i)=>`<details${i===0?" open":""}><summary>${v}</summary><ul>${l.map(x=>`<li>${x}</li>`).join("")}</ul></details>`).join("")}</div>
  </section>`;
}

function renderPdsOverview(){
  return `<section id="overview" style="scroll-margin-top:70px">
  <h1>Pilot Data Server REST API</h1>
  <p class="lead">The Pilot Data Server (PDS) exposes templates, data elements, tags, images, persons and a changelog as Atom feeds, with VDF payloads for element content. Start at the Service Document and follow links.</p>
  <div class="grid">
    <div class="card"><h4>1 · Discover</h4><p><code>GET /service</code> lists every collection, identified by <code>vizrt:type</code> or category term.</p></div>
    <div class="card"><h4>2 · Browse</h4><p>Templates link to their elements (<code>rel="elements"</code>); elements link back to their template.</p></div>
    <div class="card"><h4>3 · Create & edit</h4><p>POST/PUT an Atom entry whose content is a VDF payload pointing at the template's model.</p></div>
  </div>
  <div class="note">The server honours the <b>Accept</b> header — if you get an unexpected content type back, check it first. The examples set it for you.</div>
  <div class="note">The documentation doesn't describe authentication, so the examples send none.</div>
  <h3>Content types</h3>
  <div class="kv">
    <dt>application/atomsvc+xml</dt><dd>Atom Service Document (RFC 5023)</dd>
    <dt>application/atom+xml;type=feed</dt><dd>Collections (RFC 4287)</dd>
    <dt>application/atom+xml;type=entry</dt><dd>Single entries</dd>
    <dt>application/vnd.vizrt.payload+xml</dt><dd>VDF payload — field values</dd>
    <dt>application/vnd.vizrt.model+xml</dt><dd>VDF model — field definitions of a template</dd>
    <dt>text/html · application/xhtml+xml</dt><dd>Browser views of some resources — undocumented and may change</dd>
  </div>
  <h3>VDF in one glance</h3>
  ${codeBlock("payload.xml",`<payload xmlns="http://www.vizrt.com/types" model="${base()}/templates/10003/model">\n  <field name="01"><value>Bob the Builder</value></field>\n  <field name="02"><value>Using REST API</value></field>\n</payload>`,"xml")}
  <p style="font-size:13px;color:var(--mute)">Full specs: <a href="${base()}/documentation/vdf/model.html">VDF payload & model specification</a> (served by your PDS).</p>
  <h3>XML namespaces</h3>
  <div class="kv"><dt>app</dt><dd>http://www.w3.org/2007/app</dd><dt>atom</dt><dd>http://www.w3.org/2005/Atom</dd><dt>vdf</dt><dd>http://www.vizrt.com/types</dd><dt>vaext</dt><dd>http://www.vizrt.com/atom-ext</dd><dt>media</dt><dd>http://search.yahoo.com/mrss/</dd><dt>vizrt</dt><dd>http://www.vizrt.com/xmlns/types (service document)</dd></div>
  <h3>Status codes</h3>
  <p style="color:var(--mute);font-size:13.5px">The docs only state success codes: <b>200</b> for reads, creates and updates, <b>204</b> for deletes.</p>
  </section>`;
}

function fieldsTable(f){
  const rows=[];const subs=new Set();f.forEach(s=>{const a=s.split("|");if(a[4])a[4].split(",").forEach(x=>subs.add(x))});
  for(const s of f){const [n,t,e,d,l]=s.split("|");const isList=l!=null;
    rows.push(`<tr data-f="${esc(n)}"><td class="fn${subs.has(n)&&!isList?" sub":""}">${esc(n)}</td><td class="ty">${isList?"list":esc(t||"")}</td><td>${e==="1"?'<span class="ed">editable</span>':'<span class="ro">read-only</span>'}</td><td>${esc(d)}${isList&&l?`<div class="chips" style="margin-top:4px">${l.split(",").filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:""}</td></tr>`)}
  return `<details class="fields"><summary>VDF fields · ${f.length}</summary><table><thead><tr><th>Field</th><th>Type</th><th></th><th>Description</th></tr></thead><tbody>${rows.join("")}</tbody></table></details>`;
}

function codesHtml(c){return `<div class="codes">${c.split(",").map(x=>{const m=x.match(/^(\d{3}):?(.*)$/);if(!m)return"";const t=m[2].trim()||CODE_TXT[m[1]]||"";return `<div class="code-row"><b class="c${m[1][0]}">${m[1]}</b><span>${esc(t)}</span></div>`}).join("")}</div>`}

function epRight(r,i){
  const [m,p,,,o]=r.ep[i];const lang=S.lang;const L=LANGS.find(x=>x[0]===lang)[1];
  let h=`<div data-code>${codeBlock(L,gen(r,i,lang),lang)}</div>`;
  if(o.b)h+=codeBlock(o.bf||"body.xml",o.b.replace(/HOST/g,base()),"xml");
  return h;
}

function epHtml(r,i){
  const [m,p,sum,codes,o]=r.ep[i];const id=`${r.id}-${i}`;
  const params=[...p.matchAll(PRX)];
  let L=`<p>${sum}.</p>`;
  if(params.length)L+=`<div class="k">Parameters</div><div class="params">${params.map(x=>`<label>${esc(x[1])}</label><input data-param="${esc(pName(r,i,x[1]))}" value="${esc(S.params[pName(r,i,x[1])]??x[2])}" spellcheck="false">`).join("")}</div>`;
  if(o.ct)L+=`<div class="k">Request content-type</div><span class="chip">${esc(o.ct)}</span>`;
  if(o.rq)L+=`<div class="k">Required fields</div><div class="chips req">${o.rq.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`;
  L+=`<div class="k">Responses</div>${codesHtml(codes)}`;
  if(o.tp)L+=`<div class="k">Notes</div><ul class="tips">${o.tp.map(t=>`<li>${t}</li>`).join("")}</ul>`;
  if(o.x)for(const k in o.x)L+=`<div class="k">${esc(k)}</div><div class="chips">${o.x[k].map(v=>`<span class="chip">${esc(v)}</span>`).join("")}</div>`;
  if(o.ln)L+=`<div class="k">Links in each entry</div><ul class="tips">${o.ln.map(t=>{const j=t.indexOf(": ");return `<li><code>${esc(t.slice(0,j))}</code> ${esc(t.slice(j+2))}</li>`}).join("")}</ul>`;
  const destructive=m!=="GET";
  L+=`<div class="k">Try it</div><div class="try">${o.b||o.bf?`<textarea data-body spellcheck="false">${esc((o.b||"").replace(/HOST/g,base()))}</textarea>`:""}${o.up?`<input type="file" data-file style="font-size:12.5px;margin-bottom:8px">`:""}
    <div class="try-row"><button class="btn${destructive?" ghost":""}" data-send>${destructive?"Send "+m+"…":"Send request"}</button><span class="status" data-status></span></div>
    <div class="resp" data-resp></div></div>`;
  return `<div class="ep" id="${id}" data-ep="${r.id}|${i}"><div class="ep-h" data-toggle><span class="m ${m}">${m}</span><span class="path">${showPath(p)}</span><span class="ep-sum">${esc(sum)}</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg></div>
  <div class="ep-b"><div class="ep-l">${L}</div><div class="ep-r">${epRight(r,i)}</div></div></div>`;
}

function render(){
  let h=renderOverview();
  for(const r of RES){
    const cl=CLUSTER[r.c];
    h+=`<section class="res" id="${r.id}" data-res="${r.id}"><div class="res-head"><h2>${esc(r.t)}</h2>${cl?`<span class="pill ${cl[1]}" title="${cl[2]}">${cl[0]}</span>`:""}${r.noauth?`<span class="pill noauth" title="Some GET requests on this resource work without credentials">No auth for GET</span>`:""}<span class="pill">${GROUPS[r.g]}</span></div>
    <div class="intro">${r.d.map(p=>`<p>${p}</p>`).join("")}</div>${r.danger?`<div class="note warn-note">These calls stop or restart services. The Try-it button asks for a second click before sending.</div>`:""}
    ${r.ep.map((_,i)=>epHtml(r,i)).join("")}${r.f?fieldsTable(r.f):""}</section>`;
  }
  h+=`<div class="empty" id="empty">No endpoints match your search.</div>`;
  content.innerHTML=h;updateAuth();
}

function renderNav(){
  let h=`<div class="nav-group"><a href="#overview" data-nav="overview">Overview</a></div>`;
  GROUPS.forEach((g,gi)=>{h+=`<div class="nav-group" data-group="${gi}"><h4>${g}</h4>`;
    for(const r of RES.filter(x=>x.g===gi)){const ms=[...new Set(r.ep.map(e=>e[0]))];
      h+=`<a href="#${r.id}" data-nav="${r.id}"><span>${esc(r.t)}</span><span class="dots">${ms.map(m=>`<i style="background:var(--${m.toLowerCase()})" title="${m}"></i>`).join("")}</span></a><div data-hits="${r.id}"></div>`}
    h+=`</div>`});
  $("#nav").innerHTML=h;
}

function updateAuth(){const a=auth();$("#authPrev").textContent="Authorization: "+a;const el=$("#authHeader");if(el)el.textContent="Authorization: "+a;}
function refreshCode(scope){
  (scope||document).querySelectorAll(".ep").forEach(ep=>{const [rid,i]=ep.dataset.ep.split("|");const r=RES.find(x=>x.id===rid);ep.querySelector(".ep-r").innerHTML=epRight(r,+i)});
}

/* ============================== EVENTS ============================== */
$("#langs").innerHTML=LANGS.map(([k,v])=>`<button data-lang="${k}" class="${k===S.lang?"on":""}">${v}</button>`).join("");
$("#langs").onclick=e=>{const b=e.target.closest("[data-lang]");if(!b)return;S.lang=b.dataset.lang;save();$("#langs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));refreshCode()};
$("#user").value=S.user;$("#pass").value=S.pass;
let t;const onCfg=()=>{S.bases[S.api]=$("#baseUrl").value.trim()||API[S.api].base;S.user=$("#user").value;S.pass=$("#pass").value;save();updateAuth();clearTimeout(t);t=setTimeout(()=>refreshCode(),150)};
["baseUrl","user","pass"].forEach(id=>$("#"+id).addEventListener("input",onCfg));

content.addEventListener("click",async e=>{
  const tg=e.target.closest("[data-toggle]");if(tg){tg.parentElement.classList.toggle("open");return}
  const cp=e.target.closest("[data-copy]");if(cp){const raw=cp.closest(".cb").querySelector("pre").dataset.raw;
    const done=()=>{cp.textContent="Copied";cp.classList.add("ok");setTimeout(()=>{cp.textContent="Copy";cp.classList.remove("ok")},1400)};
    try{await navigator.clipboard.writeText(raw);done()}catch(err){const ta=document.createElement("textarea");ta.value=raw;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(_){cp.textContent="Select & copy manually"}ta.remove()}return}
  const sd=e.target.closest("[data-send]");if(sd)send(sd);
});
content.addEventListener("input",e=>{const p=e.target.closest("[data-param]");if(!p)return;S.params[p.dataset.param]=p.value;const ep=p.closest(".ep");const [rid,i]=ep.dataset.ep.split("|");ep.querySelector(".ep-r").innerHTML=epRight(RES.find(x=>x.id===rid),+i)});

async function send(btn){
  const ep=btn.closest(".ep");const [rid,i]=ep.dataset.ep.split("|");const r=RES.find(x=>x.id===rid);const [m,p,,,o]=r.ep[+i];
  const st=ep.querySelector("[data-status]");const out=ep.querySelector("[data-resp]");
  if(m!=="GET"&&btn.dataset.armed!=="1"){btn.dataset.armed="1";btn.textContent="Click again to send "+m;btn.classList.remove("ghost");btn.classList.add("warn");setTimeout(()=>{if(btn.dataset.armed==="1"){btn.dataset.armed="";btn.textContent="Send "+m+"…";btn.classList.add("ghost");btn.classList.remove("warn")}},4000);return}
  btn.dataset.armed="";if(m!=="GET"){btn.textContent="Send "+m+"…";btn.classList.add("ghost");btn.classList.remove("warn")}
  const url=base()+encodeUrlPath(fillPath(r,+i,p));const headers={};if(API[S.api].auth&&(!r.noauth||m!=="GET"))headers.Authorization=auth();if(o.ct)headers["Content-Type"]=o.ct;Object.assign(headers,o.hd||{});
  let body;const ta=ep.querySelector("[data-body]");if(ta)body=ta.value;const fi=ep.querySelector("[data-file]");if(fi&&fi.files[0]){body=fi.files[0];headers["Content-Type"]=fi.files[0].type||o.ct}
  st.textContent="Sending…";out.style.display="none";const t0=performance.now();
  try{const res=await fetch(url,{method:m,headers,body});const ms=Math.round(performance.now()-t0);const ctype=res.headers.get("content-type")||"";
    st.innerHTML=`<b class="c${String(res.status)[0]}" style="padding:1px 6px;border-radius:4px">${res.status}</b> ${esc(res.statusText)} · ${ms} ms · ${esc(ctype)}`;
    if(/image\//.test(ctype)){const u=URL.createObjectURL(await res.blob());out.innerHTML=`<img src="${u}" style="max-width:100%;border-radius:8px;margin-top:4px">`}
    else if(/audio|video|octet/.test(ctype)){const bl=await res.blob();out.innerHTML=`<p class="status">${bl.size.toLocaleString()} bytes of binary data received.</p>`}
    else{let txt=await res.text();if(/xml/.test(ctype)||txt.trim().startsWith("<"))txt=prettyXml(txt);out.innerHTML=codeBlock("Response",txt.slice(0,200000),"xml")}
    out.style.display="block";
  }catch(err){
    const same=location.origin===new URL(url,location.href).origin;
    st.innerHTML="";out.style.display="block";
    out.innerHTML=`<div class="note warn-note" style="margin:6px 0 0">The browser blocked this request${same?"":" — this page isn't served from your GH REST server, so cross-origin calls are refused"}. ${same?"Check that GH REST is running.":"Copy the example on the right into a terminal instead, or host this page in GH REST's <code>wwwroot</code> so Try&nbsp;it runs same-origin."}<br><span class="status">${esc(err.message)}</span></div>`;
  }
}
function prettyXml(x){try{const d=new DOMParser().parseFromString(x,"application/xml");if(d.querySelector("parsererror"))return x;
  const ser=(n,ind)=>{if(n.nodeType===3){const t=n.nodeValue.trim();return t?ind+t+"\n":""}if(n.nodeType===8)return ind+"<!--"+n.nodeValue+"-->\n";if(n.nodeType!==1)return"";
    const at=[...n.attributes].map(a=>` ${a.name}="${a.value}"`).join("");const kids=[...n.childNodes];
    if(!kids.length)return `${ind}<${n.nodeName}${at}/>\n`;
    if(kids.length===1&&kids[0].nodeType===3)return `${ind}<${n.nodeName}${at}>${kids[0].nodeValue.trim()}</${n.nodeName}>\n`;
    return `${ind}<${n.nodeName}${at}>\n${kids.map(k=>ser(k,ind+"  ")).join("")}${ind}</${n.nodeName}>\n`};
  return ser(d.documentElement,"")}catch(e){return x}}

/* search */
$("#q").addEventListener("input",()=>{
  const q=$("#q").value.trim().toLowerCase();let any=false;
  document.querySelectorAll("section.res").forEach(sec=>{
    const r=RES.find(x=>x.id===sec.dataset.res);let secHit=!q||r.t.toLowerCase().includes(q)||r.d.join(" ").toLowerCase().includes(q);
    const hits=[];
    sec.querySelectorAll(".ep").forEach((ep,i)=>{const e=r.ep[i];const hay=(e[0]+" "+e[1]+" "+e[2]+" "+JSON.stringify(e[4])).toLowerCase();const hit=!q||hay.includes(q)||secHit;ep.style.display=hit?"":"none";if(q&&hay.includes(q))hits.push([i,e])});
    const fHit=q&&(r.f||[]).some(f=>f.split("|")[0].toLowerCase().includes(q));
    const show=!q||secHit||hits.length||fHit;sec.style.display=show?"":"none";if(show)any=true;
    if(fHit&&!secHit&&!hits.length)sec.querySelectorAll(".ep").forEach(ep=>ep.style.display="");
    if(fHit){const d=sec.querySelector("details.fields");if(d)d.open=true}
    sec.querySelectorAll("tr[data-f]").forEach(tr=>tr.style.background=q&&tr.dataset.f.toLowerCase().includes(q)?"var(--accent-soft)":"");
    const nav=document.querySelector(`[data-nav="${r.id}"]`);nav.style.display=show?"":"none";
    document.querySelector(`[data-hits="${r.id}"]`).innerHTML=q&&!secHit?hits.slice(0,4).map(([i,e])=>`<a class="hit" href="#${r.id}-${i}">${e[0]} ${esc(e[1].replace(PRX,"{$1}"))}</a>`).join(""):"";
  });
  document.querySelectorAll("[data-group]").forEach(g=>{g.style.display=[...g.querySelectorAll("[data-nav]")].some(a=>a.style.display!=="none")?"":"none"});
  $("#overview").style.display=q?"none":"";$("#empty").style.display=any?"none":"block";
});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();$("#q").focus()}if(e.key==="Escape"&&document.activeElement===$("#q")){$("#q").value="";$("#q").dispatchEvent(new Event("input"))}});
$("#nav").addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;$("#side").classList.remove("show");const id=a.getAttribute("href").slice(1);const el=document.getElementById(id);if(el&&el.classList.contains("ep"))el.classList.add("open")});
$("#menuBtn").onclick=()=>$("#side").classList.toggle("show");

/* scroll spy */
function spy(){const secs=[$("#overview"),...document.querySelectorAll("section.res")];let cur="overview";for(const s of secs){if(s.style.display==="none")continue;if(s.getBoundingClientRect().top<120)cur=s.id}
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("active",a.dataset.nav===cur))}
window.addEventListener("scroll",()=>requestAnimationFrame(spy),{passive:true});

function openHash(){const h=location.hash.slice(1);if(!h)return;const want=h.startsWith("pds")?"pds":(h==="overview"?S.api:"gh");if(want!==S.api)switchApi(want,true);const el=document.getElementById(h);if(!el)return;if(el.classList.contains("ep"))el.classList.add("open");setTimeout(()=>el.scrollIntoView({block:"start"}),30)}
window.addEventListener("hashchange",openHash);

function switchApi(k,keepScroll){
  S.api=k;RES=API[k].res;GROUPS=API[k].groups;save();
  $("#apis").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.api===k));
  $("#brand").innerHTML=`${API[k].name}<small>${API[k].sub}</small>`;
  document.title=API[k].name+" REST API — Interactive Reference";
  $("#baseUrl").value=S.bases[k];
  document.querySelectorAll(".authfield").forEach(e=>e.classList.toggle("hide",!API[k].auth));
  $("#q").value="";renderNav();render();
  document.querySelector("#"+API[k].first+" .ep")?.classList.add("open");
  if(!keepScroll)window.scrollTo(0,0);spy();
}
$("#apis").onclick=e=>{const b=e.target.closest("[data-api]");if(b&&b.dataset.api!==S.api){history.replaceState(null,"",location.pathname);switchApi(b.dataset.api)}};
const h0=location.hash.slice(1);
switchApi(h0.startsWith("pds")?"pds":h0&&GH_RES.some(r=>h0.startsWith(r.id))?"gh":(S.api in API?S.api:"gh"),true);
openHash();
</script>
